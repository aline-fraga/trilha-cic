<div class="app-shell">
  <ng-container *ngIf="!isLoginPage">
    <header class="topbar" #topbar>
      <div class="topbar__brand">
        <span class="topbar__title">TrilhaCiC</span>
        <span class="topbar__subtitle">Portal de trilhas do curso</span>
      </div>

      <div class="topbar__student" *ngIf="currentUser">
        <span class="topbar__student-label">{{ currentUser.role }} logado</span>
        <strong>{{ currentUser.nome }}</strong>
        <span *ngIf="currentUser.cartao_ufrgs">Matrícula {{ currentUser.cartao_ufrgs }}</span>
        <button class="topbar__logout" (click)="logout()">Sair</button>
      </div>
    </header>

    <nav class="tabs-nav" aria-label="Casos de uso">
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.route"
        routerLinkActive="tabs-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="tabs-nav__link"
      >
        {{ item.label }}
      </a>
    </nav>
  </ng-container>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
